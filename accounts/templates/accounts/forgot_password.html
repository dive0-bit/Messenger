<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>

<body>

    <h1>Forgot Password?</h1>

    <p>Enter your email address and we will send you a password reset link</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</body>
</html>
